<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A better twitter">
    <link rel="canonical" href="/index.html">
    <link rel="stylesheet" href="/posts/posts.css">
    <link rel="stylesheet" href="/shared/site.css">
    <link rel="shortcut icon" href="/favicon.ico">
    <script type="module" src="/posts/mainForPosts.js"></script>
    <title>SkinScope</title>
</head>

<body>
    <div class="container">

        <header class="header">
            <nav class="nav-list">
                <h1 class="brand">SkinScope</h1>
                <ul class="nav-center">
                    <li><a href="home.html">Home</a></li>
                    <li><a id="active" href="posts.html">Posts</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <a class="login-link" href="loginPage.html">Login</a>
            </nav>
        </header>


        <div class="main-wrap">
            <aside class="sidebar" id="sidebar">
                <form id="SearchForSkins" novalidate>
                    <div class="field">
                        <label for="SearchForSkinsLabel">SearchForSkins</label>
                        <textarea name="SearchForSkins" id="SearchForSkinsTextArea" rows="1" maxlength="20"></textarea>
                    </div>
                </form>
                <form id="PriceToPrice" novalidate>
                    <div class="field">
                        <label for="PriceHigh">High</label>
                        <textarea name="PriceHigh" id="PriceHigh" rows="1" maxlength="5"></textarea>
                    </div>
                    <div class="field">
                        <label for="PriceLow">Low</label>
                        <textarea name="PriceLow" id="PriceLow" rows="1" maxlength="5"></textarea>
                    </div>
                </form>
                <div class="multipleProfileButtons" id="multipleProfileButtons">
                    <!-- Here is where all steam names and profile pictures adds -->
                </div>
            </aside>

            <main class="main" id="mainContainer">
                <div class="dropdown" id="sortDropdown">
                    <button class="dropbtn" type="button">
                        <span class="label">Main Menu</span>
                        <span class="chev"></span>
                    </button>

                    <div class="dropdown-content">
                        <button id="sortItemsByHighPriceToLowBtn">Highest Price</button>
                        <button id="sortItemsByLowPriceToHighBtn">Lowest Price</button>
                        <button id="switchToMain">Main Menu</button>
                    </div>
                </div>
                <div class="posts" id="posts"></div>
                <div class="posts" id="sortedPosts"></div>
            </main>
        </div>

        <footer class="footer" id="contact">
            <div class="leftfooter">
                <p>&copy; 2025 Rasmus Rolin</p>
            </div>

            <div class="rightfooter">
                <h2>Contact Details</h2>
                <address>
                    <p>Phone: <a href="tel:123456789">123-456-789</a></p>
                    <p>Email: <a href="mailto:Test@gmail.com">Test@gmail.com</a></p>
                    <p>Address: Näsbychaussén 48A</p>
                    <p>Open hours: 07-16</p>
                </address>
            </div>
        </footer>
    </div>

</body>
